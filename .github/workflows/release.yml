name: Release

on:
  push:
    tags: ['v*']

# Build has read access only. Signing and provenance have separate OIDC jobs;
# publish is the only job with repository-content write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ASSET: rustwtm-x86_64-pc-windows-msvc.zip
  # The tag, read from the environment rather than pasted into scripts.
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to a commit: a moved tag cannot change
      # what builds the release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # No build cache: a release is built from scratch.
      - name: Release identity
        shell: pwsh
        env:
          SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
        run: |
          scripts/ci/verify-release.ps1 -Tag $env:TAG
          if ($env:SIGNING_PROVIDER -cnotin @('', 'none', 'azure-artifact-signing')) { throw 'Unsupported WINDOWS_SIGNING_PROVIDER' }

      - name: Toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Transfer-safe release discovery controls
        shell: pwsh
        run: scripts/ci/test-release-discovery.ps1

      - name: Build
        run: cargo build --locked --release --workspace

      - name: Hardware provider
        shell: pwsh
        run: scripts/build-hardware.ps1 -OutputDir target/release/hardware

      - name: Package
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path dist/rustwtm -Force
          Copy-Item target/release/rustwtm.exe, target/release/wtm.exe, target/release/wtm-service.exe $stage
          Copy-Item target/release/hardware $stage -Recurse
          Copy-Item docs $stage -Recurse
          Copy-Item screenshots $stage -Recurse
          New-Item -ItemType Directory -Path "$stage/assets" -Force | Out-Null
          Copy-Item assets/logo.svg "$stage/assets"
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1, README.md, LICENSE, CHANGELOG.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$env:ASSET" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$env:ASSET").Hash.ToLowerInvariant()
          Set-Content -Path "dist/$env:ASSET.sha256" -Value "$hash  $env:ASSET" -NoNewline

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet wix extension add WixToolset.Util.wixext/5.0.2
          $version = $env:TAG.TrimStart('v')
          $msi = "RustWTM-$version-x64.msi"
          dotnet wix build installer/RustWTM.wxs -ext WixToolset.Util.wixext -arch x64 -d Version=$version -d BinDir=target/release -o "dist/$msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$msi").Hash.ToLowerInvariant()
          Set-Content -Path "dist/$msi.sha256" -Value "$hash  $msi" -NoNewline

      - name: Release notes
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Release $version" }
          Set-Content -Path dist/notes.md -Value $notes

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-unsigned
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/notes.md
          if-no-files-found: error

  sign:
    needs: build
    if: vars.WINDOWS_SIGNING_PROVIDER == 'azure-artifact-signing'
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate signing configuration
        shell: pwsh
        run: |
          foreach ($key in 'EXPECTED_PUBLISHER','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) { throw "Missing signing configuration: $key" }
          }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-unsigned
          path: dist/incoming
      - name: Prepare own executable paths
        id: prepare
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist/incoming/$env:ASSET" -DestinationPath dist/payload
          New-Item -ItemType Directory -Path dist/signed -Force | Out-Null
          "version=$($env:TAG.TrimStart('v'))" | Out-File $env:GITHUB_OUTPUT -Append
          'files<<FILES' | Out-File $env:GITHUB_OUTPUT -Append
          foreach ($file in 'rustwtm.exe','wtm.exe','wtm-service.exe','hardware/wtm-hardware.exe') {
            (Resolve-Path -LiteralPath (Join-Path dist/payload $file)).Path | Out-File $env:GITHUB_OUTPUT -Append
          }
          'FILES' | Out-File $env:GITHUB_OUTPUT -Append
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign own executable payload
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files: ${{ steps.prepare.outputs.files }}
          file-digest: SHA256
          timestamp-digest: SHA256
          exclude-environment-credential: true
      - name: Verify signed payload and rebuild MSI
        shell: pwsh
        run: |
          $files = 'rustwtm.exe','wtm.exe','wtm-service.exe','hardware/wtm-hardware.exe' | ForEach-Object { Join-Path dist/payload $_ }
          scripts/ci/verify-signatures.ps1 -Path $files -ExpectedPublisher $env:EXPECTED_PUBLISHER -RequireTimestamp
          dotnet tool restore
          dotnet wix extension add WixToolset.Util.wixext/5.0.2
          $version = $env:TAG.TrimStart('v')
          dotnet wix build installer/RustWTM.wxs -ext WixToolset.Util.wixext -arch x64 -d Version=$version -d BinDir=dist/payload -o "dist/signed/RustWTM-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sign rebuilt installer
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\signed\RustWTM-${{ steps.prepare.outputs.version }}-x64.msi
          file-digest: SHA256
          timestamp-digest: SHA256
          exclude-environment-credential: true
      - name: Verify installer and hash final signed bytes
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $msi = "RustWTM-$version-x64.msi"
          scripts/ci/verify-signatures.ps1 -Path "dist/signed/$msi" -ExpectedPublisher $env:EXPECTED_PUBLISHER -RequireTimestamp
          Compress-Archive -Path 'dist/payload/*' -DestinationPath "dist/signed/$env:ASSET"
          foreach ($file in $env:ASSET,$msi) {
            $hash = (Get-FileHash -LiteralPath "dist/signed/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "dist/signed/$file.sha256" -Value "$hash  $file" -NoNewline
          }
          Copy-Item -LiteralPath dist/incoming/notes.md -Destination dist/signed/notes.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-signed
          path: dist/signed/*
          if-no-files-found: error

  provenance:
    needs: [build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-artifact-signing' && 'release-signed' || 'release-unsigned' }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.msi

  publish:
    needs: [build, sign, provenance]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.provenance.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-artifact-signing' && 'release-signed' || 'release-unsigned' }}
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/notes.md
          files: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
            dist/*.msi
            dist/*.msi.sha256
