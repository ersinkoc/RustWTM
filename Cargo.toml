[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
authors = ["Ersin KOÇ <ersinkoc@gmail.com>"]
repository = "https://github.com/ersinkoc/RustWTM"
homepage = "https://github.com/ersinkoc/RustWTM"

[workspace.dependencies]
wtm-sys = { path = "crates/wtm-sys" }
wtm-core = { path = "crates/wtm-core" }
wtm-policy = { path = "crates/wtm-policy" }
wtm-ipc = { path = "crates/wtm-ipc" }

anyhow = "1.0.104"
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
egui_plot = "0.38.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
tray-icon = "0.26.1"
winreg = "0.56.0"
notify-rust = "4.18.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
winresource = "0.1.34"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = "0.62.2"
windows-service = "0.8.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

