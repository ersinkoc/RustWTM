name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes older runs of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          # The runner is an elevated, disposable VM: also exercise service
          # install / uninstall, from the build folder.
          RUSTWTM_SCM_TESTS: '1'
          RUSTWTM_ALLOW_ANY_INSTALL_DIR: '1'

      - name: Hardware provider and watchdog checks
        shell: pwsh
        run: scripts/build-hardware.ps1

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; exit 1 }
          }

      - name: Signature verification controls
        shell: pwsh
        run: scripts/ci/test-signatures.ps1

  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup show
          rustup component add llvm-tools

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        env:
          RUSTWTM_SCM_TESTS: '1'
          RUSTWTM_ALLOW_ANY_INSTALL_DIR: '1'
        shell: pwsh
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          $summary = cargo llvm-cov report --summary-only
          "## Test coverage`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v6
        with:
          name: lcov
          path: lcov.info

  # The runner is an elevated, disposable VM: install for real and verify.
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Build MSI
        shell: pwsh
        run: |
          ./scripts/build-hardware.ps1
          dotnet tool restore
          dotnet wix extension add WixToolset.Util.wixext/5.0.2
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          dotnet wix build installer/RustWTM.wxs -ext WixToolset.Util.wixext -arch x64 -d Version=$version -d BinDir=target/debug -o dist/RustWTM-test.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install, verify, uninstall
        shell: pwsh
        run: scripts/ci/verify-install.ps1 -Mode msi -Msi dist/RustWTM-test.msi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installer-under-test
          path: dist/RustWTM-test.msi
          if-no-files-found: error

      - name: Collect installer diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-diagnostics/service -Force | Out-Null
          Get-ChildItem -Path . -Filter *.log -File | Copy-Item -Destination installer-diagnostics
          if (Test-Path -LiteralPath C:/ProgramData/RustWTM/logs) {
            Get-ChildItem -LiteralPath C:/ProgramData/RustWTM/logs -File | Copy-Item -Destination installer-diagnostics/service
          }
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: msi-logs
          path: installer-diagnostics/

  upgrade:
    name: upgrade (${{ matrix.baseline }})
    needs: msi
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: '0.25.0'
            sha256: '6612ebe0b5912a8d04aaca50effdf77b3f62c7f2a7ca4b8aaed324cc875f8629'
          - baseline: '0.26.1'
            sha256: '3b606894528a0eb1628205e012757dd6e748169b7aafd9ac865f1193d0f41cba'
    env:
      BASELINE_VERSION: ${{ matrix.baseline }}
      BASELINE_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installer-under-test
          path: dist
      - name: Download pinned upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "RustWTM-${env:BASELINE_VERSION}-x64.msi"
          gh release download "v${env:BASELINE_VERSION}" --repo ersinkoc/RustWTM --pattern $asset --dir dist/baseline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $actual = (Get-FileHash (Join-Path dist/baseline $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:BASELINE_SHA256) { throw 'Upgrade baseline digest mismatch' }

      - name: Upgrade, repair, reject downgrade, preserve data
        shell: pwsh
        env:
          RUSTWTM_DISPOSABLE_INSTALL_TESTS: '1'
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $baseline = "dist/baseline/RustWTM-${env:BASELINE_VERSION}-x64.msi"
          scripts/ci/verify-upgrade.ps1 -BaselineMsi $baseline -CandidateMsi dist/RustWTM-test.msi -BaselineVersion $env:BASELINE_VERSION -CandidateVersion $version -DisposableMachine

      - name: Collect upgrade diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path upgrade-diagnostics -Force | Out-Null
          Get-ChildItem -Path . -Filter *.log -File | Copy-Item -Destination upgrade-diagnostics
          if (Test-Path -LiteralPath C:/ProgramData/RustWTM/logs) {
            Get-ChildItem -LiteralPath C:/ProgramData/RustWTM/logs -File | Copy-Item -Destination upgrade-diagnostics
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: upgrade-logs-${{ matrix.baseline }}
          path: upgrade-diagnostics/

  install-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install from source, verify, uninstall
        shell: pwsh
        run: scripts/ci/verify-install.ps1 -Mode script

      - name: Collect installer diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-diagnostics/service -Force | Out-Null
          Get-ChildItem -Path . -Filter *.log -File | Copy-Item -Destination installer-diagnostics
          if (Test-Path -LiteralPath C:/ProgramData/RustWTM/logs) {
            Get-ChildItem -LiteralPath C:/ProgramData/RustWTM/logs -File | Copy-Item -Destination installer-diagnostics/service
          }
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: install-script-logs
          path: installer-diagnostics/

  visual:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      WGPU_BACKEND: dx12
      WTM_REVIEW_LANGS: en,tr,de,fr,es
      WTM_REVIEW_TABS: Overview,Performance,Containers,Disks,Settings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Render gauge DPI gallery
        run: cargo test --locked -p wtm-gui --features visual-tests -j 2 render_gauge_review -- --test-threads=1 --nocapture
      - name: Render localized product screens
        run: cargo test --locked -p wtm-gui --features visual-tests -j 2 render_release_review -- --test-threads=1 --nocapture
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: visual-review
          path: target/visual-review
          if-no-files-found: warn

  artifact-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: msi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installer-under-test
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.msi
      - name: Verify exact CI artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify dist/RustWTM-test.msi
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          --source-digest "$GITHUB_SHA"
          --deny-self-hosted-runners
