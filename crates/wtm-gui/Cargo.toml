[package]
name = "wtm-gui"
description = "RustWTM graphical task manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rustwtm"
path = "src/main.rs"

[features]
# Opt-in GPU rendering for local visual review; regular tests stay headless.
visual-tests = ["egui_kittest/wgpu"]

[dependencies]
wtm-core.workspace = true
wtm-ipc.workspace = true
wtm-policy.workspace = true
chrono.workspace = true
# Rendered with OpenGL (glow): the default wgpu back end loads Direct3D and
# Vulkan drivers and costs the window close to 200 MB more memory.
eframe = { workspace = true, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "system_fonts",
] }
egui_extras.workspace = true
egui_plot.workspace = true
notify-rust.workspace = true
raw-window-handle = "0.6.2"
serde.workspace = true
serde_json.workspace = true
tray-icon.workspace = true
winreg.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true

[dev-dependencies]
wtm-sys.workspace = true
egui_kittest = { version = "0.37.0", features = ["eframe"] }
