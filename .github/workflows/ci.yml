name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes older runs of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          # The runner is an elevated, disposable VM: also exercise service
          # install / uninstall.
          RUSTWTM_SCM_TESTS: '1'

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; exit 1 }
          }

  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show
          rustup component add llvm-tools

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        env:
          RUSTWTM_SCM_TESTS: '1'
        shell: pwsh
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          $summary = cargo llvm-cov report --summary-only
          "## Test coverage`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  # The runner is an elevated, disposable VM: install for real and verify.
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet wix extension add WixToolset.Util.wixext/5.0.2
          dotnet wix build installer/RustWTM.wxs -ext WixToolset.Util.wixext -arch x64 -d Version=0.0.1 -d BinDir=target/debug -o dist/RustWTM-test.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install, verify, uninstall
        shell: pwsh
        run: scripts/ci/verify-install.ps1 -Mode msi -Msi dist/RustWTM-test.msi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: msi-logs
          path: |
            *.log
            C:/ProgramData/RustWTM/logs/

  install-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install from source, verify, uninstall
        shell: pwsh
        run: scripts/ci/verify-install.ps1 -Mode script
